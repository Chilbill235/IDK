<!DOCTYPE html>
<html lang="en" data-theme="dark" data-motion="auto" class="is-standalone-page">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04060a">
<meta name="robots" content="noindex,nofollow">
<title>Banned — SafeBeef</title>
<link rel="stylesheet" href="styles.css">
<style>
/* ==========================================================================
   SafeBeef — Banned page (full rewrite) — "Midnight Aurora"
   Single coherent responsive stylesheet. All JS class/id hooks preserved.
   ========================================================================== */
:root{
  --bg:#05040c; --panel:rgba(24,20,46,.72); --panel-2:rgba(12,9,26,.86);
  --line:rgba(140,120,255,.22); --line-soft:rgba(255,255,255,.08);
  --text:#e9e6ff; --text-2:#b5aed6; --text-3:#8f88b8; --text-4:#6b7890;
  --violet:#7c5cff; --violet-2:#b9a9ff; --cyan:#2ee6d6; --cyan-2:#6df0e3;
  --pink:#ff5aa0; --pink-2:#ff8ec7; --red:#ff5a6e; --red-2:#ff8294;
  --green:#34d97f; --green-2:#5cea9f; --amber:#ffb340;
  --mono:'SF Mono',ui-monospace,Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body.banned-body{
  background:radial-gradient(ellipse 120% 80% at 50% -10%,#1b1140 0%,#0a0718 55%,var(--bg) 100%) fixed;
  background-attachment:fixed;color:var(--text);font-family:var(--sans);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  display:flex;align-items:flex-start;justify-content:center;
  padding:clamp(10px,2.4vw,28px);overflow:auto;
}

/* ---------- background fx ---------- */
.banned-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.banned-bg-glow{position:absolute;inset:-10%;filter:blur(26px);
  background:
    radial-gradient(circle 520px at 15% 15%,rgba(124,92,255,.30),transparent 62%),
    radial-gradient(circle 620px at 85% 85%,rgba(46,230,214,.20),transparent 62%),
    radial-gradient(circle 460px at 60% 110%,rgba(255,90,160,.16),transparent 60%);
  animation:bgDrift 24s ease-in-out infinite alternate}
@keyframes bgDrift{0%{transform:translate(0,0) rotate(0) scale(1)}100%{transform:translate(-34px,26px) rotate(-5deg) scale(1.12)}}
.banned-bg-grain{position:absolute;inset:0;opacity:.16;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/></svg>")}
canvas#bannedParticles{position:absolute;inset:0;width:100%;height:100%}

/* ---------- skip link ---------- */
.skip-link{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;z-index:999999}
.skip-link:focus,.skip-link:focus-visible{position:fixed;top:10px;left:10px;width:auto;height:auto;
  padding:9px 16px;background:var(--violet);color:#fff;font-size:13px;font-weight:800;
  border-radius:8px;border:2px solid #fff;text-decoration:none;box-shadow:0 20px 60px rgba(0,0,0,.7)}

/* ---------- shell ---------- */
.banned-shell{
  position:relative;z-index:2;width:100%;max-width:600px;margin:auto;
  display:flex;flex-direction:column;gap:clamp(10px,1.7vw,16px);
  padding:clamp(14px,2.4vw,24px);
  background:linear-gradient(180deg,var(--panel),var(--panel-2));
  border:1px solid var(--line);border-radius:clamp(18px,2.4vw,26px);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 40px 120px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05),0 0 80px rgba(124,92,255,.14);
  max-height:calc(100dvh - clamp(20px,4.8vw,56px));overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:rgba(140,120,255,.5) transparent;
  animation:shellIn .55s cubic-bezier(.2,.9,.4,1);
}
.banned-shell::-webkit-scrollbar{width:8px}
.banned-shell::-webkit-scrollbar-thumb{background:rgba(140,120,255,.45);border-radius:4px}
.banned-shell::-webkit-scrollbar-track{background:transparent}
@keyframes shellIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.banned-shell>*{min-width:0;flex-shrink:0}

/* ---------- loading ---------- */
.banned-loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 20px}
.banned-loading-spinner{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:var(--violet);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.banned-loading-text{font-size:12.5px;color:var(--text-2)}

/* ---------- hero ---------- */
.banned-hero{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 12px;padding:2px 6px;text-align:left}
.banned-icon-wrap{width:clamp(44px,6vw,60px);height:clamp(44px,6vw,60px);font-size:clamp(20px,3vw,28px);
  border-radius:50%;display:grid;place-items:center;position:relative;flex-shrink:0;
  background:radial-gradient(circle at 50% 35%,rgba(124,92,255,.5),rgba(40,20,80,.2));
  border:1px solid rgba(140,120,255,.5);box-shadow:0 0 50px rgba(124,92,255,.5)}
.banned-icon-wrap::after{content:'';position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(from 0deg,#7c5cff,#2ee6d6,#ff5aa0,#7c5cff);
  -webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%);
  animation:ringSpin 4s linear infinite;opacity:.9}
@keyframes ringSpin{to{transform:rotate(360deg)}}
.banned-title{font-size:clamp(20px,3.4vw,30px);font-weight:900;letter-spacing:-.8px;line-height:1.1;
  background:linear-gradient(92deg,#a99bff,#6df0e3 60%,#ff8ec7);-webkit-background-clip:text;background-clip:text;color:transparent}
.banned-hero-meta{display:flex;flex-wrap:wrap;gap:6px}
.hero-badge,.hero-ban-id{font-size:clamp(8.5px,1.4vw,11px);font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  padding:3px 9px;border-radius:99px}
.hero-badge{background:rgba(124,92,255,.16);border:1px solid rgba(140,120,255,.4);color:var(--violet-2)}
.hero-ban-id{background:rgba(255,255,255,.06);border:1px solid var(--line-soft);color:var(--text-2);font-family:var(--mono);cursor:pointer;text-transform:none}
.hero-ban-id:hover{color:#fff;border-color:rgba(140,120,255,.5)}

/* ---------- countdown ---------- */
.banned-countdown-hero{border-radius:18px;padding:clamp(12px,2vw,20px)}
.banned-countdown-hero.temp{background:radial-gradient(circle at 50% 0%,rgba(124,92,255,.28),transparent 72%),linear-gradient(180deg,rgba(124,92,255,.08),rgba(124,92,255,.01));border:1px solid rgba(140,120,255,.4);box-shadow:0 0 60px rgba(124,92,255,.16)}
.banned-countdown-hero.permanent{background:radial-gradient(circle at 50% 0%,rgba(255,90,160,.28),transparent 72%),linear-gradient(180deg,rgba(255,90,160,.08),rgba(255,90,160,.01));border:1px solid rgba(255,90,160,.4);text-align:center}
.banned-countdown-hero.expired{background:linear-gradient(180deg,rgba(52,217,127,.14),rgba(52,217,127,.03));border-color:rgba(52,217,127,.5)}
.cd-label-top{display:flex;align-items:center;justify-content:center;gap:8px;font-size:clamp(9px,1.5vw,12px);font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--violet-2);margin-bottom:10px}
.cd-label-top .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(52,217,127,.9);animation:livePulse 1.5s ease-in-out infinite}
@keyframes livePulse{50%{opacity:.4;transform:scale(.8)}}
.cd-main{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.cd-ring{width:clamp(64px,10vw,88px);height:clamp(64px,10vw,88px);flex-shrink:0;position:relative;margin:0 auto}
.cd-ring-svg{width:100%;height:100%;transform:rotate(-90deg)}
.cd-ring-track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:9}
.cd-ring-fg{fill:none;stroke:var(--cyan);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .35s;filter:drop-shadow(0 0 6px rgba(109,240,227,.7))}
.critical .cd-ring-fg{stroke:var(--red);filter:drop-shadow(0 0 7px rgba(255,90,110,.85))}
.expired .cd-ring-fg{stroke:var(--green-2);filter:drop-shadow(0 0 7px rgba(92,234,159,.8))}
.cd-ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.cd-ring .cd-pct{position:static;transform:none;font-size:clamp(13px,2.2vw,17px);font-weight:900;color:var(--cyan-2);text-shadow:0 0 12px rgba(109,240,227,.55);letter-spacing:-.5px}
.critical .cd-ring .cd-pct{color:var(--red-2)}
.cd-ring-cap{font-size:7px;text-transform:uppercase;letter-spacing:1px;color:var(--text-3);font-weight:800}
.cd-segments{flex:1 1 160px;min-width:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cd-seg{padding:8px 3px 6px;border-radius:11px;text-align:center;position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(140,120,255,.3);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.cd-seg::before{content:'';position:absolute;top:0;left:15%;right:15%;height:1.5px;background:linear-gradient(90deg,transparent,rgba(140,120,255,.9),transparent)}
.cd-num{display:block;font-family:var(--mono);font-size:clamp(20px,3.4vw,30px);font-weight:900;color:var(--cyan-2);letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(109,240,227,.5)}
.cd-num.tick{animation:digitTick .32s cubic-bezier(.2,.9,.4,1)}
@keyframes digitTick{0%{transform:translateY(-38%);opacity:.3;filter:blur(1px)}100%{transform:none;opacity:1}}
.cd-lab{display:block;margin-top:4px;font-size:clamp(8px,1.3vw,11px);text-transform:uppercase;letter-spacing:1px;color:var(--text-3);font-weight:800}
.critical .cd-seg{border-color:rgba(255,90,110,.5)}
.critical .cd-num{color:var(--red-2);text-shadow:0 0 24px rgba(255,90,110,.8)}
.expired .cd-num{color:var(--green-2)}
.cd-footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 10px;margin-top:10px;padding:0 2px;font-size:clamp(9px,1.5vw,12px);color:var(--text-3);font-family:var(--mono)}
.cd-footer strong{color:var(--cyan-2);font-weight:800}
.cd-footer .expires strong{color:var(--pink-2)}
.expired .cd-footer strong{color:var(--green-2)}

/* permanent */
.perm-lock{width:clamp(52px,8vw,72px);height:clamp(52px,8vw,72px);margin:0 auto 10px;display:grid;place-items:center;font-size:clamp(28px,4.4vw,40px);filter:drop-shadow(0 0 32px rgba(255,90,110,.9))}
.perm-title{font-size:clamp(20px,3.4vw,28px);font-weight:900;letter-spacing:-.5px;background:linear-gradient(92deg,#ff8ec7,#ff5a6e);-webkit-background-clip:text;background-clip:text;color:transparent}
.perm-desc{font-size:clamp(11px,1.7vw,14px);color:var(--text-2);line-height:1.6;margin-top:8px}
.perm-desc strong{color:#fff}

/* ---------- info ---------- */
.info-section{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.info-section-head{display:flex;align-items:center;gap:10px;padding:clamp(9px,1.4vw,14px);border-bottom:1px solid var(--line-soft)}
.info-avatar{width:clamp(34px,5vw,46px);height:clamp(34px,5vw,46px);border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:clamp(12px,2vw,16px);color:#fff;flex-shrink:0;box-shadow:0 0 0 3px rgba(124,92,255,.25)}
.info-account{flex:1;min-width:0}
.info-name{font-size:clamp(12.5px,2vw,16px);font-weight:800;overflow-wrap:anywhere}
.info-user{font-size:clamp(9.5px,1.5vw,12px);color:var(--text-3);font-family:var(--mono);overflow-wrap:anywhere}
.info-status{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:clamp(8px,1.3vw,10.5px);font-weight:900;letter-spacing:.5px;text-transform:uppercase;padding:3px 9px;border-radius:99px;flex-shrink:0}
.info-status.temporary{background:rgba(124,92,255,.18);color:var(--violet-2);border:1px solid rgba(140,120,255,.4)}
.info-status.permanent{background:rgba(255,90,110,.16);color:var(--red-2);border:1px solid rgba(255,90,110,.4)}
.info-status .status-dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:livePulse 2s ease-in-out infinite}
.info-grid{padding:clamp(8px,1.4vw,14px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,1vw,10px)}
.info-cell{background:rgba(255,255,255,.05);border:1px solid var(--line-soft);border-radius:10px;padding:clamp(7px,1.2vw,12px);min-width:0;transition:border-color .18s,background .18s,transform .18s}
.info-cell:hover{border-color:rgba(140,120,255,.4);background:rgba(124,92,255,.08);transform:translateY(-1px)}
.info-cell.wide{grid-column:span 2}
.info-label{font-size:clamp(8px,1.3vw,10px);text-transform:uppercase;letter-spacing:.6px;color:var(--text-3);font-weight:800;margin-bottom:3px}
.info-value{font-size:clamp(11px,1.8vw,14px);color:var(--text);font-weight:600;overflow-wrap:anywhere;word-break:break-word}
.info-value.mono{font-family:var(--mono);font-size:clamp(9.5px,1.5vw,12px)}
.info-value.mono[title]{cursor:pointer}
.info-value.mono[title]:hover{color:var(--cyan-2)}
.info-value.reason{color:var(--pink-2);font-weight:700}

/* ---------- appeal section + banner ---------- */
.appeal-section{position:relative;overflow:hidden;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:clamp(10px,1.6vw,16px)}
.appeal-section.hidden{display:none}
.appeal-section-inner{display:flex;align-items:center;gap:12px}
.appeal-section-info{flex:1;min-width:0}
.appeal-section-title{display:flex;align-items:center;gap:6px;font-size:clamp(12px,2vw,15px);font-weight:800;color:var(--violet-2);letter-spacing:-.2px;margin-bottom:3px}
.appeal-section-desc{font-size:clamp(10px,1.6vw,12.5px);color:var(--text-2);line-height:1.45}
.appeal-action-btn{padding:clamp(8px,1.4vw,12px) clamp(12px,2vw,18px);border-radius:11px;font-size:clamp(11px,1.7vw,13px);font-weight:800;border:none;cursor:pointer;flex-shrink:0;color:#0a0718;background:linear-gradient(135deg,var(--violet),var(--cyan));box-shadow:0 6px 22px rgba(124,92,255,.35);transition:transform .15s,box-shadow .15s}
.appeal-action-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 30px rgba(124,92,255,.5)}
.appeal-action-btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}

.appeal-banner{display:none;position:relative;border-radius:16px;padding:clamp(10px,1.6vw,16px);overflow:hidden;animation:appealIn .35s cubic-bezier(.2,.9,.4,1)}
.appeal-banner.show{display:block}
@keyframes appealIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.appeal-banner.pending{background:linear-gradient(135deg,rgba(124,92,255,.18),rgba(46,230,214,.05));border:1px solid rgba(140,120,255,.42)}
.appeal-banner.approved{background:linear-gradient(135deg,rgba(46,230,214,.18),rgba(52,217,127,.06));border:1px solid rgba(46,230,214,.48)}
.appeal-banner.denied{background:linear-gradient(135deg,rgba(255,90,160,.18),rgba(255,90,110,.06));border:1px solid rgba(255,90,160,.48)}
.appeal-banner-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.appeal-banner-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.appeal-banner.pending .appeal-banner-ico{background:rgba(124,92,255,.15);color:var(--violet-2);border:1px solid rgba(140,120,255,.35)}
.appeal-banner.approved .appeal-banner-ico{background:rgba(46,230,214,.15);color:var(--green-2);border:1px solid rgba(46,230,214,.35)}
.appeal-banner.denied .appeal-banner-ico{background:rgba(255,90,110,.15);color:var(--red-2);border:1px solid rgba(255,90,110,.35)}
.appeal-banner-title{font-weight:800;font-size:clamp(12px,2vw,15px);flex:1;min-width:0}
.appeal-banner.pending .appeal-banner-title{color:var(--violet-2)}
.appeal-banner.approved .appeal-banner-title{color:var(--green-2)}
.appeal-banner.denied .appeal-banner-title{color:var(--red-2)}
.appeal-banner-status{font-size:9.5px;font-weight:900;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.6px;flex-shrink:0}
.appeal-banner.pending .appeal-banner-status{background:rgba(124,92,255,.2);color:var(--violet-2);border:1px solid rgba(140,120,255,.4)}
.appeal-banner.approved .appeal-banner-status{background:rgba(46,230,214,.2);color:var(--green-2);border:1px solid rgba(46,230,214,.4)}
.appeal-banner.denied .appeal-banner-status{background:rgba(255,90,110,.2);color:var(--red-2);border:1px solid rgba(255,90,110,.4)}
.appeal-banner-body{font-size:clamp(10.5px,1.6vw,13px);color:var(--text-2);line-height:1.55;padding-left:50px;overflow-wrap:anywhere}
.appeal-banner-body strong{color:#fff}
.appeal-banner-reason{padding-left:50px;margin-top:6px}
.appeal-banner-reason div{padding:8px 10px;border-left:3px solid var(--pink);background:rgba(0,0,0,.25);border-radius:8px;font-size:clamp(10.5px,1.6vw,13px);color:#d9d4f0;overflow-wrap:anywhere}
.appeal-banner-meta{padding-left:50px;margin-top:6px;font-size:clamp(9px,1.4vw,11px);color:var(--text-4);font-family:var(--mono);overflow-wrap:anywhere}

/* ---------- actions + footer ---------- */
.banned-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ba-btn{padding:clamp(9px,1.5vw,13px) clamp(12px,2vw,18px);border-radius:11px;font-size:clamp(11px,1.7vw,13.5px);font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .15s,box-shadow .15s,background .15s;background:rgba(255,255,255,.06);border:1px solid rgba(140,120,255,.3);color:var(--text)}
.ba-btn:hover{transform:translateY(-2px);background:rgba(124,92,255,.16);box-shadow:0 10px 30px rgba(124,92,255,.3)}
.ba-btn:active{transform:scale(.98)}
.ba-btn.primary{background:linear-gradient(135deg,var(--violet),var(--cyan));border-color:transparent;color:#0a0718;box-shadow:0 8px 26px rgba(124,92,255,.45)}
.ba-btn.primary:hover{box-shadow:0 12px 34px rgba(124,92,255,.6)}
.ba-btn.danger{background:rgba(255,90,110,.16);border-color:rgba(255,90,110,.4);color:var(--red-2)}
.banned-actions .ba-btn:first-child{grid-column:span 2}

.banned-footer{text-align:center;font-size:clamp(9.5px,1.5vw,12px);color:var(--text-4);padding:6px 4px;line-height:1.6}
.b-footer-links{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:2px 4px}
.banned-footer a{color:var(--text-4);text-decoration:none;margin:0 4px;transition:color .15s}
.banned-footer a:hover{color:var(--cyan-2)}

/* ---------- unbanned ---------- */
.unbanned-hero{text-align:center}
.unbanned-icon{width:clamp(52px,8vw,72px);height:clamp(52px,8vw,72px);font-size:clamp(28px,4.4vw,40px);margin:0 auto 12px}
.unbanned-title{font-size:clamp(20px,3.4vw,28px);font-weight:900;letter-spacing:-.5px;background:linear-gradient(92deg,#6df0e3,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.unbanned-sub{font-size:clamp(11px,1.7vw,14px);color:var(--text-2);margin:8px auto 0;max-width:420px}
.unbanned-card{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:clamp(10px,1.8vw,16px);background:rgba(46,230,214,.06);border:1px solid rgba(46,230,214,.3);border-radius:16px}
.unbanned-row{padding:8px 10px;background:rgba(0,0,0,.25);border-radius:10px;min-width:0}
.unbanned-row.full{grid-column:span 2}
.unbanned-label{font-size:clamp(8px,1.3vw,10px);text-transform:uppercase;letter-spacing:.7px;color:var(--text-3);font-weight:800}
.unbanned-value{font-size:clamp(11px,1.7vw,14px);color:#fff;font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.unbanned-footer{text-align:center;font-size:clamp(10px,1.5vw,12.5px);color:var(--text-3);line-height:1.5}

/* ---------- toasts ---------- */
.bp-toast-stack{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99999999;
  display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none;
  width:calc(100% - 28px);max-width:460px;max-height:50dvh;overflow-y:auto;scrollbar-width:none}
.bp-toast-stack::-webkit-scrollbar{display:none}
.bp-toast{pointer-events:auto;display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:14px;
  background:linear-gradient(135deg,#1a2435,#10151e);border:1px solid rgba(255,255,255,.12);
  box-shadow:0 12px 40px rgba(0,0,0,.7);position:relative;overflow:hidden;max-width:100%;
  animation:bpToastIn .35s cubic-bezier(.2,.9,.4,1.15)}
@keyframes bpToastIn{from{opacity:0;transform:translateY(-16px) scale(.96)}to{opacity:1;transform:none}}
.bp-toast.removing{animation:bpToastOut .3s ease forwards}
@keyframes bpToastOut{to{opacity:0;transform:translateY(-12px) scale(.94);max-height:0;margin:0;padding:0 14px}}
.bp-toast::before{content:'';position:absolute;top:0;bottom:0;left:0;width:4px;background:linear-gradient(180deg,#4d9dff,#7ab4ff)}
.bp-toast.success::before{background:linear-gradient(180deg,#34d97f,#5cea9f)}
.bp-toast.warn::before{background:linear-gradient(180deg,#ffb340,#ffc96b)}
.bp-toast.error::before{background:linear-gradient(180deg,#ff5a6e,#ff8294)}
.bp-toast.purple::before{background:linear-gradient(180deg,#b586ff,#c9a5ff)}
.bp-toast-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex-shrink:0;background:rgba(77,157,255,.15);border:1px solid rgba(77,157,255,.35)}
.bp-toast.success .bp-toast-ico{background:rgba(52,217,127,.15);border-color:rgba(52,217,127,.35);color:#5cea9f}
.bp-toast.warn .bp-toast-ico{background:rgba(255,179,64,.15);border-color:rgba(255,179,64,.35);color:#ffc96b}
.bp-toast.error .bp-toast-ico{background:rgba(255,90,110,.15);border-color:rgba(255,90,110,.35);color:#ff8294}
.bp-toast.purple .bp-toast-ico{background:rgba(181,134,255,.15);border-color:rgba(181,134,255,.35);color:#c9a5ff}
.bp-toast-body{flex:1;min-width:0}
.bp-toast-title{font-size:13px;font-weight:800;color:#e7edf5;margin-bottom:2px;line-height:1.3;overflow-wrap:anywhere}
.bp-toast-msg{font-size:11.5px;color:#a4b0c4;line-height:1.5;overflow-wrap:anywhere;word-break:break-word}
.bp-toast-close{width:22px;height:22px;border-radius:6px;background:transparent;border:none;color:#8893a6;font-size:15px;cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.bp-toast-close:hover{background:rgba(255,255,255,.08);color:#e7edf5}
.bp-toast-progress{position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#4d9dff,#7ab4ff);transform-origin:left;animation:bpToastProgress linear forwards}
.bp-toast.success .bp-toast-progress{background:linear-gradient(90deg,#34d97f,#5cea9f)}
.bp-toast.warn .bp-toast-progress{background:linear-gradient(90deg,#ffb340,#ffc96b)}
.bp-toast.error .bp-toast-progress{background:linear-gradient(90deg,#ff5a6e,#ff8294)}
.bp-toast.purple .bp-toast-progress{background:linear-gradient(90deg,#b586ff,#c9a5ff)}
@keyframes bpToastProgress{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* ---------- appeal modal ---------- */
.appeal-overlay{position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);overflow-y:auto}
.appeal-modal{width:100%;max-width:480px;max-height:calc(100dvh - 40px);display:flex;flex-direction:column;
  background:linear-gradient(180deg,#1d1638,#0c0920);border:1px solid rgba(140,120,255,.3);border-radius:24px;
  box-shadow:0 40px 120px rgba(0,0,0,.8);overflow:hidden;animation:appealIn .3s cubic-bezier(.2,.9,.4,1.05)}
.appeal-modal-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line-soft);background:linear-gradient(180deg,rgba(124,92,255,.12),transparent)}
.appeal-modal-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex-shrink:0;background:linear-gradient(135deg,var(--violet),var(--cyan))}
.appeal-modal-titles{flex:1;min-width:0}
.appeal-modal-titles h3{font-size:16px;font-weight:800;letter-spacing:-.3px}
.appeal-modal-sub{font-size:11.5px;color:var(--text-3);margin-top:3px;overflow-wrap:anywhere}
.appeal-modal-close{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--line-soft);color:var(--text-2);font-size:20px;cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.appeal-modal-close:hover{background:rgba(255,90,110,.15);color:var(--red-2)}
.appeal-modal-body{padding:18px 20px;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.appeal-modal-body p{font-size:12.5px;color:var(--text-2);line-height:1.6}
.appeal-modal-body label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--text-3)}
.appeal-textarea{width:100%;min-height:110px;resize:vertical;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid rgba(140,120,255,.3);color:var(--text);font-size:13px;font-family:inherit;outline:none}
.appeal-textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,92,255,.25)}
.appeal-textarea::placeholder{color:var(--text-4)}
.appeal-char-count{font-size:10.5px;color:var(--text-4);text-align:right;font-family:var(--mono)}
.appeal-modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line-soft);background:rgba(0,0,0,.2)}
.appeal-modal-foot button{padding:11px 18px;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;border:1px solid var(--line-soft);background:rgba(255,255,255,.06);color:var(--text-2);font-family:inherit}
.appeal-modal-foot button.primary{background:linear-gradient(135deg,var(--violet),var(--cyan));border-color:transparent;color:#0a0718;box-shadow:0 6px 20px rgba(124,92,255,.4)}
.appeal-modal-foot button:disabled{opacity:.5;cursor:not-allowed}

  .info-cell.wide{grid-column:span 1}

</head>
<body class="banned-body">
  <a href="#bannedShell" class="skip-link">Skip to main content</a>
  <div class="banned-bg" aria-hidden="true">
    <div class="banned-bg-glow"></div>
    <canvas id="bannedParticles"></canvas>
    <div class="banned-bg-grain"></div>
  </div>

  <div class="bp-toast-stack" id="bpToastStack"></div>

  <div class="banned-shell" id="bannedShell" role="main" tabindex="-1">
    <div class="banned-loading">
      <div class="banned-loading-spinner"></div>
      <div class="banned-loading-text">Checking ban status…</div>
    </div>
  </div>

  <script src="ip-ban.js"></script>
  <script src="push.js"></script>
  <script>
  (function () {
    'use strict';

    const PREVIEW_KEY = 'sb26_banned_preview';
    const SESSION_KEY = 'sb26_session';
    const USERS_KEY = 'sb26_users';
    const BANS_KEY = 'sb26_bans';
    const WARN_KEY = 'sb26_warnings';
    const APPEALS_KEY = 'sb26_appeals';
    const IP_BANNED_INFO = 'sb26_ip_banned_info';
    const LOGIN_URL = 'auth.html';
    const APPROVAL_GRACE_MS = 30000;
    const DENIAL_COOLDOWN_MS = 5000;

    const shell = document.getElementById('bannedShell');
    const toastStack = document.getElementById('bpToastStack');

    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
      { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
    ));

    function readJSON(key, fallback) {
      try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return v == null ? fallback : v; }
      catch (e) { return fallback; }
    }
    function readAppeals() { const a = readJSON(APPEALS_KEY, []); return Array.isArray(a) ? a : []; }
    function sessionGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
    function sessionSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
    function sessionDel(k) { try { sessionStorage.removeItem(k); } catch (e) {} }

    function setTitleForBan(display) {
      try { document.title = display ? `Banned — ${display} · SafeBeef` : `Banned — SafeBeef`; } catch (e) {}
    }
    function fmtDate(ts) {
      if (!ts) return '—';
      return new Date(ts).toLocaleString(undefined, { year: 'numeric', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }
    function fmtElapsed(ms) {
      if (ms < 0) ms = 0;
      const s = Math.floor(ms / 1000);
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      if (d > 0) return `${d}d ${h}h`;
      if (h > 0) return `${h}h ${m}m`;
      if (m > 0) return `${m}m`;
      return `${s}s`;
    }
    function makeBanId(bannedAt, username) {
      const ts = bannedAt.toString(36).toUpperCase();
      const us = (username || '').slice(0, 3).toUpperCase().padEnd(3, 'X');
      return `BAN-${us}-${ts.slice(-6)}`;
    }

    const TOAST_ICONS = { info: 'ⓘ', success: '✓', warn: '!', error: '✕', purple: '★' };
    function bpToast({ title, msg, type = 'info', dur = 5000 }) {
      if (!toastStack) return;
      const el = document.createElement('div');
      el.className = 'bp-toast ' + type;
      el.innerHTML = `
        <div class="bp-toast-ico">${TOAST_ICONS[type] || TOAST_ICONS.info}</div>
        <div class="bp-toast-body">
          <div class="bp-toast-title">${esc(title || '')}</div>
          ${msg ? `<div class="bp-toast-msg">${esc(msg)}</div>` : ''}
        </div>
        <button class="bp-toast-close" type="button" aria-label="Close">×</button>
        ${dur > 0 ? `<div class="bp-toast-progress" style="animation-duration:${dur}ms"></div>` : ''}
      `;
      toastStack.appendChild(el);
      const closeBtn = el.querySelector('.bp-toast-close');
      const remove = () => {
        if (el.classList.contains('removing')) return;
        el.classList.add('removing');
        setTimeout(() => el.remove(), 320);
      };
      if (closeBtn) closeBtn.onclick = remove;
      if (dur > 0) setTimeout(remove, dur);
      while (toastStack.children.length > 4) toastStack.firstElementChild?.remove();
      return { close: remove, el };
    }
    window.bpToast = bpToast;

    (function particles() {
      const canvas = document.getElementById('bannedParticles');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let W = 0, H = 0;
      const dots = [];
      function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
      resize();
      window.addEventListener('resize', resize);
      const count = Math.min(45, Math.floor((W * H) / 32000));
      for (let i = 0; i < count; i++) {
        dots.push({
          x: Math.random() * W, y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
          r: 0.8 + Math.random() * 2.2,
          hue: Math.random() < 0.6 ? 350 : 260,
        });
      }
      function tick() {
        ctx.clearRect(0, 0, W, H);
        for (const d of dots) {
          d.x += d.vx; d.y += d.vy;
          if (d.x < 0) d.x = W; if (d.x > W) d.x = 0;
          if (d.y < 0) d.y = H; if (d.y > H) d.y = 0;
          const alpha = 0.4 + Math.sin(Date.now() / 1000 + d.x * 0.01) * 0.2;
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${d.hue}, 90%, 65%, ${alpha})`;
          ctx.shadowBlur = 10;
          ctx.shadowColor = `hsla(${d.hue}, 90%, 65%, ${alpha})`;
          ctx.fill();
        }
        ctx.shadowBlur = 0;
        requestAnimationFrame(tick);
      }
      tick();
    })();

    function clearPreview() { sessionDel(PREVIEW_KEY); sessionDel(IP_BANNED_INFO); }
    function goLogin() { stopBanTicker(); clearPreview(); location.replace(LOGIN_URL); }

    function getBanEntry(username) {
      const bans = readJSON(BANS_KEY, {});
      return (bans.users && bans.users[username]) || null;
    }
    function isBanActive(entry) {
      if (!entry) return false;
      if (entry.expiresAt == null) return true;
      return Date.now() < entry.expiresAt;
    }
    function signatureOf(entry) {
      if (!entry) return 'none';
      return [
        entry.expiresAt == null ? 'perm' : String(entry.expiresAt),
        String(entry.reason || ''),
        String(entry.bannedBy || ''),
        String(entry.bannedAt || 0),
        entry.automated ? '1' : '0',
      ].join('|');
    }

    let _tickerId = null;
    let _state = null;
    let _lastIpCheck = 0;

    function stopBanTicker() { if (_tickerId) { clearInterval(_tickerId); _tickerId = null; } }
    function startBanTicker() { stopBanTicker(); _tickerId = setInterval(banTick, 1000); banTick(); }

    async function banTick() {
      if (!_state) return;
      try {
        if (_state.mode === 'account') await accountTick();
        else if (_state.mode === 'ip') await ipTick();
      } catch (e) { console.warn('[banned tick]', e); }
    }

    function latestAppealFor(target) {
      return readAppeals()
        .filter(a => a.username === target || a.username === '@' + target)
        .sort((a, b) => (b.at || 0) - (a.at || 0))[0] || null;
    }
    function recentApprovedAppeal(target) {
      const cutoff = Date.now() - APPROVAL_GRACE_MS;
      return readAppeals()
        .filter(a => (a.username === target || a.username === '@' + target)
          && a.status === 'approved' && a.decidedAt && a.decidedAt > cutoff)
        .sort((a, b) => (b.decidedAt || 0) - (a.decidedAt || 0))[0] || null;
    }

    async function accountTick() {
      const username = _state.username;
      const entry = getBanEntry(username);
      if (!isBanActive(entry)) {
        const approved = recentApprovedAppeal(username);
        if (approved && !_state._approvedShown) { renderUnbannedState(username, approved, false); return; }
        if (_state._approvedShown) return;
        if (window.IPBan && Date.now() - _lastIpCheck > 1500) {
          _lastIpCheck = Date.now();
          try {
            const ipEntry = await window.IPBan.checkSelf();
            if (ipEntry) { stopBanTicker(); _state = null; renderIPBan(ipEntry); return; }
          } catch (e) {}
        }
        if (!_state._unbanNotified) {
          _state._unbanNotified = true;
          bpToast({ title: '✓ You have been unbanned', msg: 'Your account is active again. Redirecting…', type: 'success', dur: 3000 });
        }
        setTimeout(goLogin, 1800);
        return;
      }
      const prev = _state.entry;
      if (signatureOf(prev) !== signatureOf(entry)) {
        const isMajor = ((entry.expiresAt == null) !== (prev.expiresAt == null)) || (entry.bannedAt !== prev.bannedAt);
        const prevExpiry = prev.expiresAt;
        const prevReason = prev.reason;
        _state.entry = entry;
        if (isMajor) {
          renderAccountBan(username, _state.user, entry);
          bpToast({ title: 'Ban updated', msg: 'A moderator changed your ban details', type: 'warn', dur: 5000 });
          return;
        }
        updateInfoFields(entry);
        if (prevExpiry != null && entry.expiresAt != null && entry.expiresAt !== prevExpiry) {
          const deltaMs = entry.expiresAt - prevExpiry;
          bpToast({
            title: deltaMs > 0 ? '⏱ Ban extended' : '⏱ Ban shortened',
            msg: deltaMs > 0 ? `Your ban was extended by ${fmtElapsed(deltaMs)}` : `Your ban was shortened by ${fmtElapsed(-deltaMs)}`,
            type: 'warn', dur: 6500,
          });
        } else if ((entry.reason || '') !== (prevReason || '')) {
          bpToast({ title: '⚠ Ban reason updated', msg: `New reason: ${entry.reason || '—'}`, type: 'warn', dur: 5500 });
        }
      }
      updateCountdown(entry);
      updateAppealStatus(username);
    }

    async function ipTick() {
      if (!window.IPBan) return;
      if (Date.now() - _lastIpCheck < 1500) return;
      _lastIpCheck = Date.now();
      try {
        const entry = await window.IPBan.checkSelf();
        if (!entry) {
          const preview = sessionGet(PREVIEW_KEY);
          if (preview) {
            const accEntry = getBanEntry(preview);
            if (isBanActive(accEntry)) {
              const users = readJSON(USERS_KEY, {});
              const user = users[preview];
              if (user) { stopBanTicker(); _state = null; renderAccountBan(preview, user, accEntry); return; }
            }
          }
          const ipTarget = '@' + (_state.entry.ip || '');
          const approved = recentApprovedAppeal(ipTarget);
          if (approved && !_state._approvedShown) { renderUnbannedState(ipTarget, approved, true); return; }
          if (_state._approvedShown) return;
          if (!_state._unbanNotified) {
            _state._unbanNotified = true;
            bpToast({ title: '✓ Device unblocked', msg: 'Redirecting…', type: 'success', dur: 3000 });
          }
          setTimeout(goLogin, 1800);
          return;
        }
        const prev = _state.entry;
        if (signatureOf(prev) !== signatureOf(entry)) {
          const isMajor = ((entry.expiresAt == null) !== (prev.expiresAt == null)) || (entry.bannedAt !== prev.bannedAt);
          const prevExpiry = prev.expiresAt;
          const prevReason = prev.reason;
          _state.entry = entry;
          if (isMajor) { renderIPBan(entry); bpToast({ title: 'Ban updated', msg: 'Device ban details changed', type: 'warn', dur: 5000 }); return; }
          updateInfoFields(entry);
          if (prevExpiry != null && entry.expiresAt != null && entry.expiresAt !== prevExpiry) {
            const deltaMs = entry.expiresAt - prevExpiry;
            bpToast({
              title: deltaMs > 0 ? '⏱ Device ban extended' : '⏱ Device ban shortened',
              msg: deltaMs > 0 ? `Block extended by ${fmtElapsed(deltaMs)}` : `Block shortened by ${fmtElapsed(-deltaMs)}`,
              type: 'warn', dur: 5500,
            });
          } else if ((entry.reason || '') !== (prevReason || '')) {
            bpToast({ title: '⚠ Ban reason updated', msg: entry.reason || '—', type: 'warn', dur: 5000 });
          }
        }
        updateCountdown(entry);
        updateAppealStatus('@' + (entry.ip || ''));
      } catch (e) {}
    }

    function updateInfoFields(entry) {
      if (!_state) return;
      const isAccount = _state.mode === 'account';
      const reasonEl = shell.querySelector('#banReason');
      if (reasonEl) reasonEl.textContent = entry.reason || (isAccount ? 'Violation of terms' : 'Ban evasion / alt-account abuse');
      const issuerEl = shell.querySelector('#banIssuer');
      if (issuerEl) {
        if (isAccount) issuerEl.innerHTML = entry.automated ? '🤖 Auto' : '@' + esc(entry.bannedBy || 'system');
        else issuerEl.textContent = '@' + (entry.bannedBy || 'system');
      }
      const issuedEl = shell.querySelector('#banIssuedAt');
      if (issuedEl) issuedEl.textContent = fmtDate(entry.bannedAt);
      const statusEl = shell.querySelector('#banStatus');
      if (statusEl) {
        if (entry.expiresAt == null) {
          statusEl.className = 'info-status permanent';
          statusEl.innerHTML = '<span class="status-dot"></span>Permanent';
        } else {
          statusEl.className = 'info-status temporary';
          statusEl.innerHTML = '<span class="status-dot"></span>Temporary';
        }
      }
    }

    function updateCountdown(entry) {
      if (entry.expiresAt == null) return;
      const block = shell.querySelector('#cdBlock');
      if (!block) return;
      const remaining = Math.max(0, entry.expiresAt - Date.now());
      if (remaining <= 0) {
        block.classList.add('expired');
        block.classList.remove('critical');
        const label = block.querySelector('.cd-label-top');
        if (label) label.innerHTML = '✓ Ban Expired — Redirecting';
        ['cdDays','cdHours','cdMins','cdSecs'].forEach(id => {
          const el = shell.querySelector('#' + id);
          if (el) el.textContent = '00';
        });
        const bar = shell.querySelector('#cdBar');
        if (bar) bar.style.width = '0%';
        const ring0 = shell.querySelector('#cdRing');
        if (ring0) { const C = 2 * Math.PI * 52; ring0.style.strokeDasharray = C.toFixed(1); ring0.style.strokeDashoffset = C.toFixed(1); }
        const pctEl0 = shell.querySelector('#cdPct');
        if (pctEl0) pctEl0.textContent = '0%';
        if (!_state._redirectPending) {
          _state._redirectPending = true;
          if (!_state._unbanNotified) {
            _state._unbanNotified = true;
            bpToast({ title: '✓ Ban expired', msg: 'Your ban has run out. Redirecting…', type: 'success', dur: 3000 });
          }
          setTimeout(goLogin, 1800);
        }
        return;
      }
      block.classList.remove('expired');
      if (_state) _state._redirectPending = false;
      const d = Math.floor(remaining / 86400000);
      const h = Math.floor((remaining % 86400000) / 3600000);
      const m = Math.floor((remaining % 3600000) / 60000);
      const s = Math.floor((remaining % 60000) / 1000);
      const cdDays = shell.querySelector('#cdDays'); if (cdDays) cdDays.textContent = String(d).padStart(2, '0');
      const cdHours = shell.querySelector('#cdHours'); if (cdHours) cdHours.textContent = String(h).padStart(2, '0');
      const cdMins = shell.querySelector('#cdMins'); if (cdMins) cdMins.textContent = String(m).padStart(2, '0');
      const cdSecs = shell.querySelector('#cdSecs');
      if (cdSecs) {
        const secStr = String(s).padStart(2, '0');
        if (cdSecs.textContent !== secStr) {
          cdSecs.textContent = secStr;
          cdSecs.classList.remove('tick');
          void cdSecs.offsetWidth;
          cdSecs.classList.add('tick');
        }
      }
      const bannedAt = entry.bannedAt || (entry.expiresAt - 86400000);
      const total = Math.max(1, entry.expiresAt - bannedAt);
      const pct = Math.max(0, Math.min(100, (remaining / total) * 100));
      const bar = shell.querySelector('#cdBar');
      if (bar) { bar.style.width = pct + '%'; bar.classList.toggle('critical', pct < 15); }
      const ring = shell.querySelector('#cdRing');
      if (ring) {
        const C = 2 * Math.PI * 52;
        ring.style.strokeDasharray = C.toFixed(1);
        ring.style.strokeDashoffset = (C * (1 - pct / 100)).toFixed(1);
      }
      const pctEl = shell.querySelector('#cdPct');
      if (pctEl) pctEl.textContent = Math.round(pct) + '%';
      block.classList.toggle('critical', pct < 15);
      const sinceEl = shell.querySelector('#cdSince');
      if (sinceEl) sinceEl.innerHTML = `Banned <strong>${esc(fmtElapsed(Date.now() - bannedAt))}</strong> ago`;
      const expiresInEl = shell.querySelector('#cdExpiresIn');
      if (expiresInEl) expiresInEl.innerHTML = `Unbans in <strong>${esc(fmtElapsed(remaining))}</strong>`;
    }

    let _lastAppealSig = '';
    function deliverPush(payload, targetUsername) {
      try {
        const send = (body) => fetch('/__sb__/push/send', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
        });
        const first = { payload };
        if (targetUsername && targetUsername.charAt(0) !== '@') first.targetUsername = targetUsername;
        send(first).then(async r => {
          let sent = 0;
          try { const j = await r.json(); sent = j.sent || 0; } catch (_) {}
          if (first.targetUsername && (!r.ok || sent === 0)) send({ payload }).catch(() => {});
        }).catch(() => {});
      } catch (e) {}
    }

      const mine = latestAppealFor(target);
      const sig = mine ? `${mine.status}|${mine.at}|${mine.decidedAt || 0}|${mine.decisionReason || ''}` : 'none';

      // Auto-dismiss denied/approved banners after 5s so the user can appeal again.
      if (mine && (mine.status === 'denied' || mine.status === 'approved')) {

    async function resolveTarget() {
      const preview = sessionGet(PREVIEW_KEY);
      if (preview) {
        const entry = getBanEntry(preview);
        if (isBanActive(entry)) return { type: 'user', username: preview };
      }
      const session = readJSON(SESSION_KEY, null);
      const current = session && session.username;
      if (current) {
        const entry = getBanEntry(current);
        if (isBanActive(entry)) return { type: 'user', username: current };
      }
      if (window.IPBan) {
        try {
          const entry = await window.IPBan.checkSelf();
          if (entry) return { type: 'ip', entry };
        } catch (e) {}
      }
      const info = sessionGet(IP_BANNED_INFO);
      if (info) { try { return { type: 'ip', entry: JSON.parse(info) }; } catch (e) {} }
      return null;
    }

    async function boot() {
      try {
        const previewEarly = sessionGet(PREVIEW_KEY);
        if (previewEarly) {
          const usersEarly = readJSON(USERS_KEY, {});
          const uEarly = usersEarly[previewEarly];
          if (uEarly) setTitleForBan(uEarly.display || previewEarly);
        }
      } catch (e) {}
      const target = await resolveTarget();
      if (!target) { goLogin(); return; }
      if (target.type === 'user') {
        window.__sbPushUsername = target.username;
        try { if (window.subscribePush) window.subscribePush(); } catch (e) {}
      }
      if (target.type === 'ip') { renderIPBan(target.entry); return; }
      const users = readJSON(USERS_KEY, {});
      const user = users[target.username];
      if (!user) { goLogin(); return; }
      if (user.role === 'owner' || user.role === 'mod') { goLogin(); return; }
      const entry = getBanEntry(target.username);
      if (!isBanActive(entry)) { goLogin(); return; }
      sessionSet(PREVIEW_KEY, target.username);
      renderAccountBan(target.username, user, entry);
    }

    function buildCountdownBlock(permanent, expiresAt, bannedAt, remaining) {
      if (permanent) {
        return `

              Only a moderator can lift a permanent ban.
            </div>
          </div>`;
      }
      const d = Math.floor(remaining / 86400000);
      const h = Math.floor((remaining % 86400000) / 3600000);
      const m = Math.floor((remaining % 3600000) / 60000);
      const s = Math.floor((remaining % 60000) / 1000);
      const total = Math.max(1, expiresAt - bannedAt);
      const pct = Math.max(0, Math.min(100, (remaining / total) * 100));
      const elapsed = Date.now() - bannedAt;
      const critical = pct < 15;
      const C = 2 * Math.PI * 52;
      const dash = C * (1 - pct / 100);
      return `
        <div class="banned-countdown-hero temp${critical ? ' critical' : ''}" id="cdBlock">

              </svg>
              <div class="cd-ring-center"><span class="cd-pct" id="cdPct">${Math.round(pct)}%</span><span class="cd-ring-cap">served</span></div>
            </div>
            <div class="cd-segments">
              <div class="cd-seg"><span class="cd-num" id="cdDays">${String(d).padStart(2, '0')}</span><span class="cd-lab">Days</span></div>

              <div class="cd-seg"><span class="cd-num" id="cdMins">${String(m).padStart(2, '0')}</span><span class="cd-lab">Minutes</span></div>
              <div class="cd-seg"><span class="cd-num pulse" id="cdSecs">${String(s).padStart(2, '0')}</span><span class="cd-lab">Seconds</span></div>
            </div>
          </div>
          <div class="cd-footer">
            <div id="cdSince">Banned <strong>${esc(fmtElapsed(elapsed))}</strong> ago</div>
            <div class="expires" id="cdExpiresIn">Unbans in <strong>${esc(fmtElapsed(remaining))}</strong></div>
          </div>
        </div>`;
    }

    }

    function wireCommonActions({ mode, username, ip, entry, banId }) {
      const authBtn = shell.querySelector('#authBtn');
      if (authBtn) authBtn.onclick = () => { clearPreview(); location.href = LOGIN_URL; };
      const refreshBtn = shell.querySelector('#refreshBtn');
      if (refreshBtn) refreshBtn.onclick = () => {
        _lastIpCheck = 0;
        banTick();
        bpToast({ title: 'Refreshed', msg: 'Ban status re-checked', type: 'info', dur: 2000 });
      };
      const appealBtn = shell.querySelector('#appealBtn');
      if (appealBtn) appealBtn.onclick = () => openAppealModal(mode === 'account' ? username : '@' + ip);
      const copyBtn = shell.querySelector('#copyBtn');
      if (copyBtn) copyBtn.onclick = () => copyBanDetails({ mode, username, ip, entry, banId });
      const heroBanId = shell.querySelector('#heroBanId');
      if (heroBanId) heroBanId.onclick = () => {
        copyToClipboard(banId, () => bpToast({ title: 'Copied', msg: banId, type: 'success', dur: 2000 }));
      };
      const banFp = shell.querySelector('#banFp');
      if (banFp) banFp.onclick = () => {
        const fp = banFp.textContent || '';
        copyToClipboard(fp, () => bpToast({ title: 'Fingerprint copied', msg: 'Hardware fingerprint copied to clipboard', type: 'success', dur: 2500 }));
      };
    }

    function copyToClipboard(text, onDone) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(onDone).catch(() => fallbackCopy(text, onDone));
      } else {
        fallbackCopy(text, onDone);
      }
    }
    function fallbackCopy(text, onDone) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy');
        document.body.removeChild(ta); onDone && onDone();
      } catch (_) {}
    }

    function copyBanDetails({ mode, username, ip, entry, banId }) {
      const permanent = entry.expiresAt == null;
      const lines = [
        `SafeBeef Ban Details`, `────────────────────`,
        `Ban ID: ${banId}`,
        `Type: ${permanent ? 'Permanent' : 'Temporary'}`,
        mode === 'account' ? `Account: @${username}` : `Device IP: ${ip}`,
        `Reason: ${entry.reason || 'Violation of terms'}`,
        `Issued by: ${entry.automated ? 'Auto' : '@' + (entry.bannedBy || 'system')}`,
        `Issued at: ${fmtDate(entry.bannedAt)}`,
        permanent ? `Expiry: Never` : `Expiry: ${fmtDate(entry.expiresAt)}`,
      ];
      copyToClipboard(lines.join('\n'), () => {
        bpToast({ title: 'Copied to clipboard', msg: 'Ban details are on your clipboard', type: 'success', dur: 2500 });
      });
    }

    function openAppealModal(target) {
      document.querySelectorAll('.appeal-overlay').forEach(el => el.remove());
      const appeals = readAppeals();
      const pending = appeals.find(a => (a.username === target || a.username === '@' + target) && a.status === 'pending');
      if (pending) { bpToast({ title: 'Already pending', msg: 'You already have a pending appeal', type: 'warn', dur: 4000 }); return; }
      const latest = latestAppealFor(target);
      if (latest && latest.status === 'denied' && latest.decidedAt) {
        const elapsed = Date.now() - latest.decidedAt;
        if (elapsed < DENIAL_COOLDOWN_MS) {
          const remaining = Math.ceil((DENIAL_COOLDOWN_MS - elapsed) / 1000);
          bpToast({ title: 'Cooldown', msg: `Please wait ${remaining}s before submitting a new appeal`, type: 'warn', dur: 4000 });
          return;
        }
      }
      const previous = appeals
        .filter(a => (a.username === target || a.username === '@' + target) && a.status === 'denied')
        .sort((a, b) => (b.decidedAt || 0) - (a.decidedAt || 0))[0];
      const prevHtml = previous && previous.decisionReason ? `
        <div class="appeal-prev-note">
          <strong>Previous appeal was denied:</strong><br>
          "${esc(previous.decisionReason)}"
          <br><span style="opacity:.75">Please address this in your new appeal.</span>
        </div>` : '';
      const overlay = document.createElement('div');
      overlay.className = 'appeal-overlay';
      overlay.innerHTML = `
        <div class="appeal-modal" role="dialog" aria-modal="true">
          <div class="appeal-modal-head">
            <div class="appeal-modal-ico">📝</div>
            <div class="appeal-modal-titles">
              <h3>Submit an Appeal</h3>
              <div class="appeal-modal-sub">A moderator will review your case and reply</div>
            </div>
            <button class="appeal-modal-close" type="button" aria-label="Close">×</button>
          </div>
          <div class="appeal-modal-body">
            <p>Explain briefly why this ban should be lifted. Be honest and specific — vague appeals are usually denied.</p>
            ${prevHtml}
            <div>
              <label for="appealText">Your appeal</label>
              <textarea id="appealText" class="appeal-textarea" maxlength="1000" placeholder="I believe this ban was issued in error because…"></textarea>
              <div class="appeal-char-count" id="appealCount">0 / 1000</div>
            </div>
            <p style="font-size:11px;color:#6b7890;margin:0">
              💡 <strong>Tip:</strong> Appeals under 10 characters will be rejected automatically. Explain what happened and what you'll do differently.
            </p>
          </div>
          <div class="appeal-modal-foot">
            <button id="appealCancel" type="button">Cancel</button>
            <button class="primary" id="appealSubmit" type="button" disabled>Submit Appeal</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      const ta = overlay.querySelector('#appealText');
      const countEl = overlay.querySelector('#appealCount');
      const submitBtn = overlay.querySelector('#appealSubmit');
      const close = () => overlay.remove();
      setTimeout(() => ta.focus(), 100);
      const updateState = () => {
        const n = ta.value.length;
        countEl.textContent = `${n} / 1000`;
        countEl.classList.toggle('over', n > 1000);
        submitBtn.disabled = ta.value.trim().length < 10;
      };
      ta.addEventListener('input', updateState);
      updateState();
      overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
      overlay.querySelector('.appeal-modal-close').onclick = close;
      overlay.querySelector('#appealCancel').onclick = close;
      submitBtn.onclick = () => {
        const text = ta.value.trim();
        if (text.length < 10) { ta.style.borderColor = '#ff5a6e'; ta.focus(); return; }
        let freshAppeals = readAppeals();
        if (!Array.isArray(freshAppeals)) freshAppeals = [];
        const now = Date.now();
        const newAppeal = {
          id: 'appeal-' + now.toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase(),
          username: target, reason: text.slice(0, 1000),
          at: now, atISO: new Date(now).toISOString(), atLocal: new Date(now).toLocaleString(),
          status: 'pending', decidedAt: null, decidedBy: null, decisionReason: null,
        };
        freshAppeals.push(newAppeal);
        while (freshAppeals.length > 200) freshAppeals.shift();
        try { localStorage.setItem(APPEALS_KEY, JSON.stringify(freshAppeals)); } catch (e) {}
        close();
        bpToast({ title: '✓ Appeal submitted', msg: `Reference: ${newAppeal.id}. A moderator will review your case.`, type: 'success', dur: 7000 });
        beepConfirm();
        _lastAppealSig = '';
        if (_state && _state.mode === 'account') updateAppealStatus(_state.username);
        else if (_state && _state.mode === 'ip') updateAppealStatus('@' + (_state.entry.ip || ''));
        try { window.SafeBeef?.appChannel?.postMessage({ type: 'appeal-updated' }); } catch (e) {}
        notifyModsAppeal(target);
      };
    }

    function beepConfirm() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ctx = new AC();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    }

    try {
      const ch = new BroadcastChannel('sb26_bans_v64');
      ch.onmessage = (e) => {
        const m = e.data || {};
        if (!m.action) return;
        if (m.action.startsWith('ip-ban') || m.action.startsWith('ip-unban') ||
            m.action.startsWith('account-ban') || m.action.startsWith('account-unban') ||
            m.action === 'appeal-updated') { _lastIpCheck = 0; banTick(); }
      };
    } catch (e) {}

    try {
      const appCh = new BroadcastChannel('safebeef_v26');
      appCh.onmessage = (e) => {
        const m = e.data || {};
        if (m.type === 'frozen-changed' || m.type === 'ban-changed' ||
            m.type === 'report-created' || m.type === 'appeal-updated') { _lastIpCheck = 0; banTick(); }
      };
    } catch (e) {}

    window.addEventListener('storage', (e) => {
      if (!e.key) return;
      if (e.key === 'sb26_bans' || e.key === 'sb26_ip_bans' || e.key === 'sb26_ip_bans_mirror' ||
          e.key === 'sb26_users' || e.key === 'sb26_appeals' || e.key === 'sb26_frozen_users') {
        _lastIpCheck = 0;
        banTick();
      }
    });

    setInterval(() => {
      if (document.visibilityState === 'visible') { _lastIpCheck = 0; banTick(); }
    }, 3000);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') { _lastIpCheck = 0; banTick(); }
    });

    window.addEventListener('beforeunload', stopBanTicker);

    // Register the service worker (required for push) and subscribe this device
    // so the banned user can receive moderator replies even with the tab closed.
    (function initPushOnBanned() {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
        window.__sbPushUsername = (_state && _state.username) || window.__sbPushUsername || 'unknown';

        const trySubscribe = async () => {
          try {
            if (!window.isPushSupported || !window.isPushSupported()) return;
            if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
              await window.subscribePush();
            }
          } catch (e) { /* best effort */ }
        };

        if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
          trySubscribe();
        } else {
          const ask = async () => {
            try {
              if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
                await Notification.requestPermission();
              }
            } catch (e) {}
            trySubscribe();
          };
          window.addEventListener('pointerdown', ask, { once: true });
          window.addEventListener('keydown', ask, { once: true });
        }
      } catch (e) { /* ignore */ }
    })();

    boot();
  })();
  </script>
</body>
</html>
